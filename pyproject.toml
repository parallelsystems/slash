[build-system]
requires = ["hatchling>=0.25.1", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "slash"
description = "A Modern Testing Framework for Large-scale Projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD 3-Clause License" }

classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "arrow",
    "colorama",
    "confetti>=2.5.3",
    "dessert>=1.6.3,<2",
    "emport~=1.3.1",
    "gossip>=2.3.0",
    "Jinja2",
    "Logbook>=1.2.0",
    "ordered-set",
    "requests>=1.1.0",
    "SQLAlchemy",
    "libtmux",
    "raven",
    "py>=1.5.0",
    "pyparsing",
    "vintage>=0.4.0",
    "brotli",
    "IPython==1.2.1; implementation_name=='pypy'",
    "IPython; implementation_name!='pypy'",
]

dynamic = ["version"]

authors = [
    { name = "Rotem Yaari", email = "vmalloc@gmail.com" },
]

[project.urls]
"Homepage" = "http://getslash.github.io/"
"GitHub" = "https://github.com/getslash/slash"


[project.scripts]
slash  = "slash.frontend.main:main_entry_point"

[project.optional-dependencies]
testing = [
    "coverage",
    "coveralls",
    "munch",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pyforge",
    "astroid>=4.0,<5",
    "pylint>=4.0,<5",
]
doc = [
    "alabaster",
    "docutils",
    "releases~=1.6.1",
    "Sphinx",
]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout_method = "signal"
addopts = "-ra -W error::DeprecationWarning"
